AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role that lets __COMPANY_NAME__ enable cost optimization tooling (one-time setup, safe to delete afterwards)

Resources:
  RootRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: __COMPANY_SHORT_NAME__CostOptimizationEnablementRole
      Description: IAM role that lets __COMPANY_NAME__ enable cost optimization tooling (one-time setup)
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::__TRUSTED_ACCOUNT_ID__:root
            Action: sts:AssumeRole
            Condition: {}
      Policies:
        # Minimal write actions needed to enable cost optimization tooling
        # (opt-ins and cost allocation tags), plus read access to their enrollment
        # status so the setup can be confirmed with this role alone;
        # no access to payments or resources
        - PolicyName: __COMPANY_SHORT_NAME__CostOptimizationEnablement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadEnrollmentStatus
                Effect: Allow
                Action:
                  - compute-optimizer:GetEnrollmentStatus
                  - cost-optimization-hub:ListEnrollmentStatuses
                  - cost-optimization-hub:GetPreferences
                  - ce:ListCostAllocationTags
                Resource: "*"
              - Sid: EnrollCostOptimizationServices
                Effect: Allow
                Action:
                  - compute-optimizer:UpdateEnrollmentStatus
                  - cost-optimization-hub:UpdateEnrollmentStatus
                  - cost-optimization-hub:UpdatePreferences
                  - ce:UpdateCostAllocationTagsStatus
                Resource: "*"
              - Sid: CreateComputeOptimizerServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/compute-optimizer.amazonaws.com/AWSServiceRoleForComputeOptimizer*
                Condition:
                  StringLike:
                    iam:AWSServiceName: compute-optimizer.amazonaws.com
              - Sid: ConfigureComputeOptimizerServiceLinkedRole
                Effect: Allow
                Action: iam:PutRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/compute-optimizer.amazonaws.com/AWSServiceRoleForComputeOptimizer
              - Sid: CreateCostOptimizationHubServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub*
                Condition:
                  StringLike:
                    iam:AWSServiceName: cost-optimization-hub.bcm.amazonaws.com
